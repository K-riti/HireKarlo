name: Release & Publish

on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===== NPM PUBLISH =====
  npm-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:npm

      - name: Publish to NPM
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ===== NUGET PUBLISH =====
  nuget-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore HireKarlo.slnx

      - name: Build
        run: dotnet build -c Release --no-restore HireKarlo.slnx

      - name: Pack
        run: dotnet pack -c Release -o nupkg src/Sdks/HireKarlo.Sdk/HireKarlo.Sdk.csproj

      - name: Push to NuGet
        run: dotnet nuget push "nupkg/*.nupkg" 
             -k ${{ secrets.NUGET_API_KEY }} 
             -s https://api.nuget.org/v3/index.json 
             --skip-duplicate

  # ===== DOCKER BUILD & PUSH =====
  docker-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===== VS CODE EXTENSION =====
  vscode-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build VS Code extension
        run: npm run build:extension:vscode

      - name: Publish to VS Code Marketplace
        run: npx vsce publish --pat ${{ secrets.VSCE_PAT }}

  # ===== CHROME EXTENSION =====
  chrome-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build Chrome extension
        run: npm run build:extension:chrome

      - name: Publish to Chrome Web Store
        uses: PlasmoHQ/bpp@v3
        with:
          keys: ${{ secrets.CHROME_EXTENSION_KEY }}
          source: dist/extension-chrome.zip
          extensionId: ${{ secrets.CHROME_EXTENSION_ID }}

  # ===== FIREFOX EXTENSION =====
  firefox-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build Firefox extension
        run: npm run build:extension:firefox

      - name: Publish to Firefox Add-ons
        run: npx web-ext submit
             --api-key=${{ secrets.FIREFOX_API_KEY }}
             --api-secret=${{ secrets.FIREFOX_API_SECRET }}
             --source-dir=dist/extension-firefox

  # ===== GITHUB RELEASE =====
  create-release:
    runs-on: ubuntu-latest
    needs: [npm-publish, nuget-publish, docker-publish, vscode-publish]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body: |
            ## 📦 Packages Published

            - **NPM**: [@hirekarlo/sdk@${{ steps.version.outputs.VERSION }}](https://www.npmjs.com/package/@hirekarlo/sdk)
            - **NuGet**: [HireKarlo.Sdk/${{ steps.version.outputs.VERSION }}](https://www.nuget.org/packages/HireKarlo.Sdk)
            - **Docker**: [ghcr.io/K-riti/HireKarlo:${{ steps.version.outputs.VERSION }}](https://github.com/K-riti/HireKarlo/pkgs/container/hirekarlo)
            - **VS Code**: [HireKarlo](https://marketplace.visualstudio.com/items?itemName=HireKarlo.hirekarlo)
            - **Chrome**: [HireKarlo Career Copilot](https://chrome.google.com/webstore/detail/hirekarlo)
            - **Firefox**: [HireKarlo](https://addons.mozilla.org/firefox/addon/hirekarlo/)

            See [CHANGELOG.md](https://github.com/K-riti/HireKarlo/blob/main/CHANGELOG.md) for details.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
